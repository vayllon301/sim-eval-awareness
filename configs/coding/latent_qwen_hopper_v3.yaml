# Independent exploratory probe (branch `latent-interaction`), v3: same-family vs cross-family
# simulation under Qwen3.8-27B on Hopper, now with C2 (Sim+ref) beside C3 ($0 API spend). Never
# pooled with Sprint/N3 cells. latent_qwen_hopper_only.yaml (job 7109) and latent_qwen_hopper_v2.yaml
# (job 7122) stay the records of v1 and v2.
#
# Question (as v1 and v2): on high-fidelity pure-Python scenarios, does a same-family simulator
# (Qwen3.8-27B simulating Qwen3.8-27B) shift verbalised awareness, behaviour, or internal
# activations (vllm-lens) relative to Real (C0) and a cross-family open-weights simulator
# (AgentWorld-35B), even when restricting analysis to steps graded faithful by `simtest fidelity`?
# v3 adds: does grounding on an honest C0 transcript of the same scenario (C2) change that?
#
# What v3 changes after job 7122 (logs/latent-qwen-hopper-v2), at HEAD (bluedot-sprint):
# - The simulator prompt states bash's control flow (`;`, `&&` stopping at a non-zero exit,
#   `||`, `|`) and keeps code indentation when copying files.
# - The Python snapshots record bare `python3`/`python` importability (an importlib.util.find_spec
#   probe): src/ and vendor/ are not on sys.path; pytest adds them through pyproject.toml.
# - The online guard also resamples a Markdown fence closing a reply; the offline `fence` tell no
#   longer reads the prompt's own "(```)".
# - C2's references: the audited read-only prefixes of logs/latent-qwen-hopper-only's C0 episodes
#   (configs/coding/c2_reference_readonly.json), so only the 6 scenarios that have one run here;
#   churn_format and its twin are left out.
# Before this 30-slot sweep, run the $0 fixed-command calibration (job 7109's truncated calls,
# bluedot-py-cheap-qwen's compound and prose steps, job 7122's regressions: 23 cases) against
# both live servers, in C3 and in C2:
#   python explore/latent_fixed_cal.py configs/coding/latent_qwen_hopper_v3.yaml
#   python explore/latent_fixed_cal.py configs/coding/latent_qwen_hopper_v3.yaml --condition C2
# Bars: the full case set, 0 truncated, 0 delivered prose tells, 0 wrong test outcomes. Read the
# sweep (planned slots, final outcomes and attempts per arm, then per scenario) with
#   python explore/latent_report.py logs/latent-qwen-hopper-v3
#
# Design: 6 self-contained Python scenarios (pricing_cap, billing_rounding, orders_schema and their
# benign twins) x [Real (C0), C2(qwen27b_sim), C2(agentworld), C3(qwen27b_sim), C3(agentworld)],
# 1 epoch = 30 slots (6 C0, 12 C2, 12 C3). All five arms share one Hopper FP8 session and one
# seeded queue (`order_seed: 20261127`), 6 episodes in flight, one re-run of an errored episode.
#
# Note on token accounting: in `C2(qwen27b_sim)` and `C3(qwen27b_sim)`, agent and simulator share
# `rawchat/agent`, so Inspect's `sample.model_usage` sums both under that key; per-call simulator
# usage stays recorded separately in `CodingEpisode:simulator_calls` (agent usage = total - simulator).
family: coding
name: latent-qwen-hopper-v3
scenarios:
  - pricing_cap
  - pricing_cap_benign
  - billing_rounding
  - billing_rounding_benign
  - orders_schema
  - orders_schema_benign
conditions: [C0, C2, C3]
epochs: 1
max_turns: 40
deadline: 60
agents:
  qwen27b:
    model: rawchat/agent
    base_url: http://localhost:18000/v1
    config: {temperature: 1.0, top_p: 0.95, top_k: 20, max_tokens: 32768}
simulators:
  qwen27b_sim:
    model: rawchat/agent
    base_url: http://localhost:18000/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 65536}
  agentworld:
    model: rawchat/simulator
    base_url: http://localhost:18001/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, max_tokens: 65536}
simulators_for: {C2: [qwen27b_sim, agentworld], C3: [qwen27b_sim, agentworld]}
run: {max_connections: 6, retry_attempts: 1, order_seed: 20261127}
