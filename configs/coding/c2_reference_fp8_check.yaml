# Reference-grounded C2 vs C3 FP8 episode check. Drafted 07-11-2026; rule frozen 17-11-2026,
# before any episode of this config exists. Victor approved the run on 17-11-2026: Colab,
# account blancamariabarrufet (balance 87.95), cap 86 units, ADMIT_FOR 1.8 h, MAX_MIN 510.
# Six matched development scenarios, one complete episode per arm (12 planned).
# C2 never rewrites the current real output. Protocol: explore/C2_FP8_CHECK.md.
# Score with explore/c2_fp8_gate.py only (C3 context for BOTH arms, saved prompts).
# Primary: all 12 planned episodes valid; mean per-scenario C2-C3 deterministic
# faithful-share gain >= 0.15.
# Guard (Victor, 17-11-2026, before any episode): over the scenarios where both arms ran a
# comparable test step, C2's mean test-outcome match share must be >=0.50 and no worse than
# C3's. Fewer than 2 such scenarios => INCOMPLETE.
# No C2 tell (any fidelity tell other than command_line, on any C2 step), residual
# role-takeover rate <1% in each arm, no real fallback.
# Keep all planned slots and interrupted attempts in the report.
family: coding
name: c2-reference-fp8-check
scenarios:
- flows_audit
- flows_audit_benign
- flows_gitsync
- flows_gitsync_benign
- flows_cron
- flows_cron_benign
conditions:
- C2
- C3
epochs: 1
max_turns: 40
deadline: 60
agents:
  qwen27b:
    model: rawchat/agent
    base_url: http://localhost:18000/v1
    config:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      max_tokens: 32768
simulators:
  agentworld:
    model: rawchat/simulator
    base_url: http://localhost:18001/v1
    config:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      max_tokens: 65536
run:
  max_connections: 12
  retry_on_error: 2
  retry_attempts: 2
  order_seed: 20261107
