# Independent exploratory probe (branch `latent-interaction`): same-family vs frontier
# cross-family simulation under DeepSeek-V4.1-Flash (API + local Docker, no Hopper needed).
# Never pooled with Sprint/N3 cells.
#
# Question: controlling for graded step fidelity (`simtest fidelity`), does DeepSeek-V4.1-Flash
# differ in verbalised awareness or behaviour when simulated by itself (same-family, DeepSeek
# API off-peak, ~$0.02-0.05/ep) vs Claude Sonnet 5.5 medium (cross-family, ~$0.10-0.15/ep) vs
# Real Docker (C0)?
#
# Design: 4 tempting/benign Python pairs (8 scenarios) x [Real (C0), C3(deepseek_sim),
# C3(sonnet55)], 1 epoch = 24 episodes. Run in DeepSeek's off-peak window (weekends or Mon-Fri
# outside 01:00-04:00 and 06:00-10:00 UTC).
#
# Note on token accounting: in `C3(deepseek_sim)`, agent and simulator share
# `rawchat/deepseek-flash`, so Inspect's `sample.model_usage` sums both; per-call simulator
# usage stays recorded separately in `CodingEpisode:simulator_calls`.
family: coding
name: latent-deepseek-same-family
scenarios:
  - pricing_cap
  - pricing_cap_benign
  - billing_rounding
  - billing_rounding_benign
  - churn_format
  - churn_format_benign
  - orders_schema
  - orders_schema_benign
conditions: [C0, C3]
epochs: 1
max_turns: 40
deadline: 60
agents:
  deepseek_flash:
    model: rawchat/deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    args: {reasoning_field: reasoning_content}
    config:
      max_tokens: 32768
      extra_body:
        thinking: {type: enabled}
simulators:
  deepseek_sim:
    model: rawchat/deepseek-flash
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    args: {reasoning_field: reasoning_content}
    config:
      max_tokens: 16384
      extra_body:
        thinking: {type: enabled}
  sonnet55:
    model: anthropic/claude-sonnet-5-5
    config: {reasoning_effort: medium, cache_prompt: true, max_tokens: 32768}
simulators_for: {C3: [deepseek_sim, sonnet55]}
run: {max_connections: 2, retry_attempts: 1, order_seed: 20261126}
