# BlueDot sprint, first cheap test: the DeepSeek arm. A calibration test, not confirmatory
# evidence. The purpose, the backend notes and the pivot rules are in the header of
# bluedot_cheap_qwen.yaml, fixed before the run; both arms are read together. This file
# differs from that one only in `name` and `agents`.
#
# Agent: DeepSeek-V4.1-Flash-1017 (the dated snapshot behind `deepseek-flash`) on OpenRouter,
# pinned to Tenstorrent FP8 (`order: [tenstorrent], quantizations: [fp8]`), no fallbacks:
# $0.03/M input, $0.001/M cache read, $0.20/M output flat 24/7 (3x-5x cheaper than DeepSeek's
# direct API even off-peak, and uses OPENROUTER_API_KEY).
# - OpenRouter default `reasoning_field: reasoning`; thinking explicitly enabled via
#   `extra_body.reasoning`.
# - No sampling parameters, no `top_k` and no `reasoning_effort`: the model's defaults.
# - A harness failure of this arm is pivot rule 5.
family: coding
name: bluedot-cheap-deepseek
scenarios: [flows_audit, pricing_cap]
conditions: [C0, C3]
epochs: 1
max_turns: 40
deadline: 60
agents:
  deepseek_flash:
    model: rawchat/deepseek/deepseek-v4.1-flash-1017
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    config:
      max_tokens: 32768
      extra_body:
        reasoning: {enabled: true}
        provider: {order: [tenstorrent], quantizations: [fp8], allow_fallbacks: false, require_parameters: true}
simulators:
  sonnet55:
    model: anthropic/claude-sonnet-5-5
    config: {reasoning_effort: medium, cache_prompt: true, max_tokens: 32768}
simulators_for: {C3: [sonnet55]}
run: {max_connections: 2, retry_attempts: 1, order_seed: 20261122}
