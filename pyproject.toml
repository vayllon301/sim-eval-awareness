[project]
name = "simtest"
version = "0.1.0"
description = "Testbed: do LLM-simulated tools change agent rule-following?"
requires-python = ">=3.14.1"
dependencies = [
    "inspect-ai==0.3.281",
    "markdown-it-py==4.2.0",  # reads the Markdown agents write in report fields (fields.py)
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "pyyaml>=6",
]

[project.scripts]
simtest = "simtest.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The 'initial' parameter is deprecated:DeprecationWarning"]
