[project]
name = "simtest"
version = "0.1.0"
description = "Testbed: does an LLM-simulated environment change an AI agent's evaluation awareness or behaviour?"
requires-python = ">=3.14.1"
dependencies = [
    "inspect-ai==0.3.281",
    "markdown-it-py==4.2.0",  # reads the Markdown agents write in report fields (fields.py)
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Interpretability tooling (src/simtest/interp, docs/INTERP.md): `uv sync --extra interp`.
# MLX runs on Apple Silicon only (docs/INTERP.md).
interp = [
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2",
    "safetensors>=0.6",
    "transformers>=5",
]
# The torch backend (src/simtest/interp/hf_backend.py) and its offline tests on a tiny random
# model on CPU: `uv run --extra torch pytest -q tests/test_interp_hf.py`. The GPU install is in
# explore/interp/gpu_smoke.sh (vLLM pins its own torch and transformers).
torch = [
    "numpy>=2",
    "safetensors>=0.6",
    "torch>=2.10",
    "transformers>=5",
]

[project.scripts]
simtest = "simtest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "safetensors>=0.6",  # the interp tests read and write vector files offline
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The 'initial' parameter is deprecated:DeprecationWarning"]
markers = ["interp_model: needs local model weights (set SIMTEST_INTERP_MODEL); skipped by default"]
